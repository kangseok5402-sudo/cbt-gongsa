, "years": ["10-2", "18-2"], "question": "가공송전선로에서 이도 설계 시 전선에 가해지는 하중의 종류 (3가지)", "answer": "① 전선의 자중\n② 풍압 하중\n③ 빙설 하중", "q_image": "", "a_image": ""}, {"id": "m_5_1", "chapter": "m", "type": "1", "number": 5, "years": ["02-4"], "question": "전력선의 이도(Dip)을 결정하는 요소 (4가지)", "answer": "경간, 장력, 전선의 하중, 안전율", "q_image": "", "a_image": ""}, {"id": "m_6_5", "chapter": "m", "type": "5", "number": 6, "years": ["14-4", "20-4"], "question": "수변전설비 용량을 추정하는 수용률, 부등률, 부하율을 구하는 공식", "answer": " ", "q_image": "", "a_image": "m_6_5.png"}, {"id": "m_7_5", "chapter": "m", "type": "5", "number": 7, "years": ["01-2", "21-2"], "question": "터파기 계산방법을 수식으로 쓰시오.", "answer": " ", "q_image": "m_7_5.png", "a_image": "m_7_5.png"}, {"id": "m_8_5", "chapter": "m", "type": "5", "number": 8, "years": ["24-3"], "question": "대지저항률이 ρ[Ω·m]인 균등한 지표면에서\n반지름 r[m] 인 반구 접지전극을 매설하였을 때\n접지저항이 R=ρ/2πr 임을 유도하시오.", "answer": " ", "q_image": "", "a_image": "m_8_5.png"}, {"id": "n_1_3", "chapter": "n", "type": "3", "number": 1, "years": ["01-1"], "question": "계기용 변압기 1차측 및 2차측에 퓨즈를 부착하는지 여부와 이유", "answer": "· 여부 : 1차측 및 2차측에 부착\n· 이유 : 계기용 변압기 2차 부하의 단락 및 과부하 또는 계기용 변압기 단락 시 퓨즈가 차단되어\n사고가 확대되는 것을 방지", "q_image": "", "a_image": ""}, {"id": "n_2_2", "chapter": "n", "type": "2", "number": 2, "years": ["03-1", "24-2"], "question": "[변류기 문제 O, X]\n⑴ 저압 변류기 2차 배선의 도중에는 접속점을 만들어서는 안된다.\n⑵ 저압 변류기의 2차 배선은 공사상 지장이 없는 한 최단거리로 배선하여야 한다.\n⑶ 저압 변류기 2차 배선은 케이블에 직접 장력이 걸릴 우려가 있는 경우에는 적당한 방법으로 케이블을 고정하여야 한다.\n⑷ 계기용 저압 변류기에는 전력거래에 관련되는 계기 및 부속기구 이외의 것을 접속하여서는 안된다.\n⑸ 변류기 2차 회로는 개방되지 않도록 특별히 유의 하여야 한다.", "answer": "⑴ ○\n⑵ ○\n⑶ ○\n⑷ ○\n⑸ ○", "q_image": "", "a_image": ""}, {"id": "n_3_2", "chapter": "n", "type": "2", "number": 3, "years": ["21-4"], "question": "변류기 분류방식에서 절연구조에 따른 변류기의 종류 (3가지)", "answer": "가스형, 몰드형, 유입형", "q_image": "", "a_image": ""}, {"id": "n_4_3", "chapter": "n", "type": "3", "number": 4, "years": ["04-2"], "question": "ZCT와 CT의 결선 차이점", "answer": "· ZCT : 3상의 3선 모두 ZCT를 관통시킨다.\n· CT : 3상의 1선만 CT를 관통시킨다.", "q_image": "", "a_image": ""}, {"id": "n_5_1", "chapter": "n", "type": "1", "number": 5, "years": ["04-2", "07-1", "15-1", "18-1", "20-2"], "question": "COS 설치에 사용되는 자재 (5가지)", "answer": "① COS\n② 브라켓트\n③ 내오손 결합애자\n④ COS 커버\n⑤ 퓨즈링크", "q_image": "", "a_image": ""}, {"id": "n_6_3", "chapter": "n", "type": "3", "number": 6, "years": ["18-4"], "question": "차단기와 단로기의 차이점", "answer": "① 차단기\n: 평상시 부하전류를 개폐하고, 사고 시 고장전류(단락·지락전류 등)를 자동 차단하는 장치\n② 단로기\n: 부하전류를 개폐할 수 없으며, 무부하 시 선로나 기기를 분리·변경하기 위해 사용하는 개폐장치", "q_image": "", "a_image": ""}, {"id": "n_7_2", "chapter": "n", "type": "2", "number": 7, "years": ["04-1", "05-1"], "question": "저압전로에  시설하는  누전차단기  등은  전류동작형으로서  누전  차\n단기의 조작용 손잡이 또는 누름 단추는 어떤 구조의 것인가?", "answer": "트립프리 (Trip Free)", "q_image": "", "a_image": ""}, {"id": "n_8_3", "chapter": "n", "type": "3", "number": 8, "years": ["04-1", "07-4", "12-1"], "question": "LBS(Load Breaker Switch)에 대하여 설명하시오.", "answer": "· 명칭 : 부하 개폐기\n· 기능 : 부하전류를 개폐할 수 있는 단로기로 3상 연동으로 투입, 개방토록 되어 있으며, 고장전류를 차단할 수 있는 한류퓨즈와 직렬로 조합하여 사용", "q_image": "", "a_image": ""}, {"id": "n_9_1", "chapter": "n", "type": "1", "number": 9, "years": ["20-1"], "question": "LBS의 설치 목적", "answer": "① 수변전설비의 인입구 개폐기로 사용되며 평상 시 부하전류를 개폐할 수 있다.\n② PF를 겸용한 LBS는 과전류, 단락전류를 보호한다.", "q_image": "", "a_image": ""}, {"id": "n_10_2", "chapter": "n", "type": "2", "number": 10, "years": ["02-1"], "question": "ELB의 명칭", "answer": "누전 차단기", "q_image": "", "a_image": ""}, {"id": "n_11_2", "chapter": "n", "type": "2", "number": 11, "years": ["05-1", "14-2", "18-1", "18-4", "24-1"], "question": "차단기 약호의 명칭\n⑴ ELB                           ⑵ NFB (MCCB)\n⑶ OCB                          ⑷ MBB\n⑸ GCB                          ⑹ VCB\n⑺ ACB                          ⑻ ABB", "answer": "⑴ 누전차단기           ⑵ 배선차단기\n⑶ 유입차단기           ⑷ 자기차단기\n⑸ 가스차단기           ⑹ 진공차단기\n⑺ 기중차단기           ⑻ 공기차단기", "q_image": "", "a_image": ""}, {"id": "n_12_3", "chapter": "n", "type": "3", "number": 12, "years": ["15-4"], "question": "고압개폐기 각각의 용도\n⑴ 단로기\n⑵ 고압부하 개폐기\n⑶ 진공부하 개폐기\n⑷ 고압 차단기\n⑸ 고압전력용 퓨즈", "answer": "1) 무부하 시 선로나 기기의 분리·구분·변경하고 부하전류 개폐 불가\n2) 빈도 적은 장소의 부하전류 개폐\n3) 빈도 많은 장소의 부하전류 개폐\n4) 부하전류 및 고장전류 차단\n5) 부하개폐기와 조합하여 단락전류 차단", "q_image": "", "a_image": ""}, {"id": "n_13_4", "chapter": "n", "type": "4", "number": 13, "years": ["21-2"], "question": "저압 전기설비에서 과전류 차단기로 저압전로에 사용하는 주택용 배선차단기의 특성에 관한 표", "answer": "1.13배, 1.45배", "q_image": "n_13_4.png", "a_image": ""}, {"id": "n_14_2", "chapter": "n", "type": "2", "number": 14, "years": ["16-2"], "question": "차단기의 동작 책무에 의해 차단기를 재투입할 경우 전자기계력에 의한 반발력을 견디어야 하는데 차단기의 정격 투입전류는 최대(정격) 차단전류의 몇 배 이상을\n선정하는가?", "answer": "2.5배", "q_image": "", "a_image": ""}, {"id": "n_15_2", "chapter": "n", "type": "2", "number": 15, "years": ["11-1"], "question": "전자 개폐기의 조작회로는 소세력회로로 하여야 하는데,\n이 때 소세력 회로의 최대 전압 [V]", "answer": "60 [V]", "q_image": "", "a_image": ""}, {"id": "n_16_2", "chapter": "n", "type": "2", "number": 16, "years": ["04-4"], "question": "가스절연 개폐장치 (GIS)에 사용하는 가스의 종류는?", "answer": "SF6", "q_image": "", "a_image": ""}, {"id": "n_17_1", "chapter": "n", "type": "1", "number": 17, "years": ["11-2"], "question": "가스차단기에 사용되는 SF6 가스의 전기적인 특성 (4가지)", "answer": "﻿① 절연내력이 높다.\n② 소호성능이 뛰어나다.\n③ 아크가 안정되어 있다.\n④ 절연회복이 빠르다.", "q_image": "", "a_image": ""}, {"id": "n_18_1", "chapter": "n", "type": "1", "number": 18, "years": ["14-2", "23-4"], "question": "SF6 가스 차단기에 대한 장점 (3가지 또는 5가지)", "answer": "① 밀폐구조이므로 소음이 적다.\n② 절연거리를 적게 할 수 있어 차단기 전체를 소형화 및 경량화 할 수 있다.\n③ 근거리 고장 등 가혹한 재기전압에 대해서도 성능이 우수하다. \n④ 소호 시 아크가 안정되어 있어 차단저항이 필요없고 접촉자의 소모가 극히 적다.\n⑤ SF6 가스 중에 수분이 존재하면 내전압 성능이 저하하고 저온에서 가스가 액화하므로 겨울철에는 보온장치 등이 필요하다.", "q_image": "", "a_image": ""}, {"id": "n_19_1", "chapter": "n", "type": "1", "number": 19, "years": ["16-4", "17-4"], "question": "가스 차단기(GCB)의 특징 (5가지)", "answer": "① 밀폐구조이므로 소음이 적다.\n② 절연거리를 적게 할 수 있어 차단기 전체를 소형화 및 경량화 할 수 있다.\n③ 근거리 고장 등 가혹한 재기전압에 대해서도 성능이 우수하다. \n④ 소호 시 아크가 안정되어 있어 차단저항이 필요없고 접촉자의 소모가 극히 적다.\n⑤ SF6 가스 중에 수분이 존재하면 내전압 성능이 저하하고 저온에서 가스가 액화되므로 겨울철에는 보온장치 등이 필요하다.", "q_image": "", "a_image": ""}, {"id": "n_20_3", "chapter": "n", "type": "3", "number": 20, "years": ["04-4", "06-2", "19-2", "23-1"], "question": "그림과 같은 계통에서 단로기 DS_3을 통하여 부하를 공급하고 차단기 CB를 점검하고자 할 때 조작 순서 (평상시 DS_3은 open 상태)\n\n(1) 점검을 하기 위한 조작 순서\n(2) CB를 점검 완료 후 원상복귀 시킬 때의 조작 순서", "answer": " ", "q_image": "n_20_3.png", "a_image": "n_20_3.png"}, {"id": "n_21_3", "chapter": "n", "type": "3", "number": 21, "years": ["03-2", "18-2"], "question": "전류동작형 누전차단기에서 저항 R의 설치목적", "answer": "누전 차단기 자체 동작 시험 시 흐르는 전류를 일정값 이상으로 흐르지 못하게 억제", "q_image": "n_21_3.png", "a_image": ""}, {"id": "n_22_1", "chapter": "n", "type": "1", "number": 22, "years": ["23-2"], "question": "주택용 누전차단기의 정격 감도 전류 (3가지)", "answer": "① 10 [mA]\n② 15 [mA]\n③ 30 [mA]", "q_image": "", "a_image": ""}, {"id": "n_23_2", "chapter": "n", "type": "2", "number": 23, "years": ["05-1"], "question": "주택의  옥내에  시설하는 300[V]  이하의  분전반에 반드시  설치하여\n야 할 인체 감전 보호장치 (*참고서⑱)", "answer": "누전 차단기", "q_image": "", "a_image": ""}, {"id": "n_24_3", "chapter": "n", "type": "3", "number": 24, "years": ["17-2", "22-4"], "question": "GPT에서 오픈델타 결선에 연결한 ‘R’의 명칭과 용도", "answer": "· 명칭 : CLR (한류 저항기)\n· 용도 : 계전기를 동작시키는 데 필요한 유효전류를 발생시키고 오픈델타 회로의 각 상전압 중의 제3고조파 억제", "q_image": "n_24_3.png", "a_image": ""}, {"id": "n_25_3", "chapter": "n", "type": "3", "number": 25, "years": ["13-2"], "question": "ASS(자동고장구분개폐기)의 기능 및 용도에 대해 간단히 설명", "answer": "무부하시 개방이 가능하고, 과부하 시 고장 구간을 자동 개방하여 사고를 방지할 수 있는 고장 구분 개폐기로 돌입전류 억제 기능을 갖고 있다.", "q_image": "", "a_image": ""}, {"id": "n_26_1", "chapter": "n", "type": "1", "number": 26, "years": ["21-2"], "question": "ASS(자동고장구분개폐기)의 동작기능 (3가지)", "answer": "① 고장구간을 자동 개방\n② 전부하 상태에서 자동 또는 수동 투입 및 개방\n③ 과부하 및 고장전류 검출", "q_image": "", "a_image": ""}, {"id": "n_27_2", "chapter": "n", "type": "2", "number": 27, "years": ["07-2", "11-2"], "question": "사용 전원과 예비전원의 양 전원 접속점에 반드시 설치해야 할 전로 기구", "answer": "전환개폐기", "q_image": "", "a_image": ""}, {"id": "n_28_4", "chapter": "n", "type": "4", "number": 28, "years": ["03-2", "08-2", "12-2"], "question": "각 용어의 정의\n⑴ 과전류차단기라 함은 배선차단기, 퓨즈, 기중차단기와 같이\n( ① ) 및 ( ② )를 자동 차단하는 기능을 가진 기구를 말한다.\n⑵ 누전차단장치라함은 전로에 지락이 생겼을 경우에\n부하 기기 금속제 외함 등에 발생하는 ( ③ ) 또는 ( ④ )를 검출하는 부분과 차단기 부분을 조합하여 자동적으로 전로를 차단하는 장치를 말한다.\n⑶ 과전류라 함은 과부하전류 및 ( ⑤ )를 말한다.\n⑷ 중성선이라 함은 ( ⑥ ) 전로에서 전원의 ( ⑦ )에 접속된 전선을 말한다.", "answer": "① 과부하전류          ② 단락전류\n③ 고장전압             ④ 지락전류\n⑤ 단락전류             ⑥ 다선식 \n⑦ 중성점", "q_image": "", "a_image": ""}, {"id": "n_29_2", "chapter": "n", "type": "2", "number": 29, "years": ["12-2"], "question": "정격 소비전력이 몇 [kW] 이상이면 전기기계기구에 전기를 공급하기 위한 전로에\n전용의 개폐기 및 과전류 차단기를 시설하는가?", "answer": "3 [kW]", "q_image": "", "a_image": ""}, {"id": "n_30_2", "chapter": "n", "type": "2", "number": 30, "years": ["17-2"], "question": "접지공사를 한 저압전로에 접속하는 옥내배선의 중성선 또는 접지측 전선에 접속하는 그림과 같은 분기회로에서 ①의 전기적으로 완전히 접속하고 쉽게 분리할 수 있는 경우에 생략할 수 있는 것", "answer": "개폐기", "q_image": "n_30_2.png", "a_image": ""}, {"id": "n_31_2", "chapter": "n", "type": "2", "number": 31, "years": ["02-1", "02-2", "07-2", "22-2"], "question": "ABB의 명칭", "answer": "공기 차단기", "q_image": "", "a_image": ""}, {"id": "n_32_2", "chapter": "n", "type": "2", "number": 32, "years": ["02-1"], "question": "OCB의 명칭", "answer": "유입 차단기", "q_image": "", "a_image": ""}, {"id": "o_1_2", "chapter": "o", "type": "2", "number": 1, "years": ["23-4"], "question": "과전류 계전기의 동작시간에 따른 분류\n아래 설명이 무엇을 뜻하는지 작성하시오.\n⑴ 정정된 최소동작전류 이상의 전류가 흐르면 즉시 동작하는 것으로써 0.5~2초 정도의 짧은 시간에 동작하는 것을 고속도 계전기라고 한다.\n⑵ 정정된 값 이상의 전류가 흘렀을 때 동작전류의 크기와 관계없이 항상 정해진 시간이 경과한 후에 동작하는 것\n⑶ 정정된 값 이상의 전류가 흘러서 동작할 때 전류가 클수록 빨리 동작하고, 전류가 작을수록 느리게 동작하는 것", "answer": "⑴ 순시\n⑵ 정한시\n⑶ 반한시", "q_image": "", "a_image": ""}, {"id": "o_2_1", "chapter": "o", "type": "1", "number": 2, "years": ["14-1"], "question": "수배전반에 사용하는 보호계전기 약호와 명칭 (4가지)", "answer": "① OCR : 과전류 계전기\n② OCGR : 지락과전류계전기\n③ UVR : 부족전압계전기\n④ RDF : 비율차동계전기", "q_image": "", "a_image": ""}, {"id": "o_3_4", "chapter": "o", "type": "4", "number": 3, "years": ["22-4"], "question": "22.9kV 특고압 수전설비의 단선결선도\n도면 ⒜~⒞의 명칭과 약호", "answer": "⒜ 영상 변류기 (ZCT)\n⒝ 계기용 변압기 (PT)\n⒞ 트립 코일 (TC)", "q_image": "o_3_4.png", "a_image": ""}, {"id": "o_4_2", "chapter": "o", "type": "2", "number": 4, "years": ["20-3"], "question": "전력계통에서 적용하는 보호방식 중에서 방사성 계통의 단락보호에 적합하며, 계전기 간의 동작 시간차로 고장구간을 차단하는 것으로 주보호와 후비보호를 동시에 할 수 있어 경제적이지만 보호시간이 길어지는 단점을 가지는 것의 명칭", "answer": "과전류 계전방식", "q_image": "", "a_image": ""}, {"id": "o_5_2", "chapter": "o", "type": "2", "number": 5, "years": ["02-1"], "question": "GPT의 명칭", "answer": "접지형 계기용 변압기", "q_image": "", "a_image": ""}, {"id": "p_1_2", "chapter": "p", "type": "2", "number": 1, "years": ["04-4"], "question": "아날로그 멀티 테스터기로 교류전압을 측정하려고 할 때\n절환스위치의 위치를 최소의 배율값부터 놓고 측정하게되면\n회로 시험기의 소손 여부", "answer": "소손될 우려가 있다.", "q_image": "", "a_image": ""}, {"id": "p_2_2", "chapter": "p", "type": "2", "number": 2, "years": ["15-4", "22-1"], "question": "저항을 측정하는 데 적당한 계측기\n⑴ 변압기의 절연저항\n⑵ 검류계의 내부저항\n⑶ 전해액의 저항\n⑷ 백열전구의 필라멘트 (백열상태)\n⑸ 배전선의 전류", "answer": "⑴ 절연저항계 (Megger)\n⑵ 휘스톤 브리지\n⑶ 콜라우시 브리지\n⑷ 전압강하법\n⑸ 후크온 메타", "q_image": "", "a_image": ""}, {"id": "p_3_2", "chapter": "p", "type": "2", "number": 3, "years": ["02-2"], "question": "브리지의 원리를 이용하여 선로의 고장점(1선지락)을 검출하는 방법", "answer": "머레이 루프법", "q_image": "", "a_image": ""}, {"id": "p_4_2", "chapter": "p", "type": "2", "number": 4, "years": ["19-1"], "question": "저압전로의 절연저항을 측정하는 계측기의 명칭", "answer": "절연저항계", "q_image": "", "a_image": ""}, {"id": "p_5_2", "chapter": "p", "type": "2", "number": 5, "years": ["04-2"], "question": "아날로그 멀티 테스터기를 사용하여 전기흐름의 단선여부를 판단하려고 할 때, 절환 스위치를 교류전압, 직류전압, 저항의 위치 중 어느곳에 놓고 측정하는가?", "answer": "저항", "q_image": "", "a_image": ""}, {"id": "p_6_2", "chapter": "p", "type": "2", "number": 6, "years": ["01-4", "05-2"], "question": "무엇을 측정하는 것인가? (*참고서⑥)", "answer": "선간 절연 저항", "q_image": "p_6_2.png", "a_image": ""}, {"id": "q_1_4", "chapter": "q", "type": "4", "number": 1, "years": ["07-2"], "question": "코드 및 캡타이어 케이블의 단말처리 규정\n「코드 및 캡타이어 케이블과 로제트 또는 소켓단자의 접속점에는 2개연 코드일 경우에 ( ① ) 묶음으로 하고\n대편코드, 원형코드 및 캡타이어 케이블일 경우에\n코드 페스너 등으로 ( ② )이 걸리지 않도록 시공하여야 한다.」", "answer": "① S자형\n② 장력", "q_image": "", "a_image": ""}, {"id": "q_2_2", "chapter": "q", "type": "2", "number": 2, "years": ["01-4", "07-1", "12-1"], "question": "15[kV] N-RC는 네온관용 전선기호이다. C는 무슨 뜻인가?", "answer": "클로로프렌 (*N:네온, R:고무절연)", "q_image": "", "a_image": ""}, {"id": "q_3_2", "chapter": "q", "type": "2", "number": 3, "years": ["15-4"], "question": "N-EV는 네온관용 전선기호이다.\nE는 무슨 뜻인가?", "answer": "폴리에틸렌\n(*N:네온전선, V:비닐)", "q_image": "", "a_image": ""}, {"id": "q_4_2", "chapter": "q", "type": "2", "number": 4, "years": ["02-4"], "question": "전선의 명칭은 옥외용 비닐절연전선 규격은 22, 38, 60, 100, 150 [mm2]가 있다.\n용도는 저압전압선, 변압기 2차 인하선에 사용한다. 이 전선의 약호는?", "answer": "OW", "q_image": "", "a_image": ""}, {"id": "q_5_2", "chapter": "q", "type": "2", "number": 5, "years": ["03-2", "20-3", "24-1"], "question": "강심 알루미늄 연선의 약호, 규격(4종류), 용도", "answer": "· 약호 : ACSR\n· 규격 : 19, 32, 58, 80, 95, 120, 160, 200, 240, 330, 410,\n520, 610 [mm2]\n· 용도\n① 큰 인장하중을 필요로 하는 가공전선 및 특고압 중성선에 사용\n② 코로나 방지가 필요한 초고압 송·배전선로에 사용", "q_image": "", "a_image": ""}, {"id": "q_6_3", "chapter": "q", "type": "3", "number": 6, "years": ["05-1", "12-4", "15-2"], "question": "송전선로에 ACSR(강심알루미늄연선)을 많이 사용하는 이유", "answer": "· 경동선에 비해 기계적 강도가 크고 가볍다.\n· 같은 저항값에 대해 전선의 바깥지름이 경동선보다 크므로\n코로나 발생 억제에 유효하다.", "q_image": "", "a_image": ""}, {"id": "q_7_1", "chapter": "q", "type": "1", "number": 7, "years": ["19-4"], "question": "송전선로에서 강심알루미늄연선(ACSR)을 사용하는 이유를 경동연선과 비교하여 설명 (3가지)", "answer": "① 기계적 강도가 크다.\n② 비교적 가볍다.\n③ 전선의 바깥지름이 크기 때문에 코로나 방지에 유리하다.", "q_image": "", "a_image": ""}, {"id": "q_8_2", "chapter": "q", "type": "2", "number": 8, "years": ["09-1", "11-2", "15-2", "23-4"], "question": "전선 약호에 따른 명칭\n⑴ ACSR                 ⑵ OW                    ⑶ A-Al\n⑷ DV                     ⑸ OE                     ⑹ MI\n⑺ EV                     ⑻ OC", "answer": "⑴ 강심알루미늄연선           ⑵ 옥외용 비닐절연전선\n⑶ 연알루미늄선                 ⑷ 인입용 비닐절연전선\n⑸ 옥외용 폴리에틸렌 절연전선\n⑹ 미네랄 인슈레이션 케이블\n⑺ 폴리에틸렌 절연 비닐 시스 케이블\n⑻ 옥외용 가교 폴리에틸렌 절연전선", "q_image": "", "a_image": ""}, {"id": "q_9_2", "chapter": "q", "type": "2", "number": 9, "years": ["11-2", "13-2"], "question": "그림과 같이 3상 4선식 접속의 경우 전압선 및 중성선 표시가 L1, N, L2, L3 으로 표시 되었을 때 전선의 색깔은?", "answer": "· L1 : 갈\n· N : 청\n· L2 : 흑\n· L3 : 회", "q_image": "", "a_image": ""}, {"id": "q_10_3", "chapter": "q", "type": "3", "number": 10, "years": ["12-1"], "question": "고압 인하용 절연전선의 용도", "answer": "고압가공전선로에서 주상변압기의 1차측에 연결하는 데 사용되는 전선", "q_image": "", "a_image": ""}, {"id": "q_11_1", "chapter": "q", "type": "1", "number": 11, "years": ["13-4"], "question": "가공 송전선로에서 사용되는 대표적인 전선 (3가지)", "answer": "① 강심 알루미늄 연선 (ACSR)\n② 내열 강심 알루미늄선 (TACSR)\n③ 경동연선", "q_image": "", "a_image": ""}, {"id": "q_12_2", "chapter": "q", "type": "2", "number": 12, "years": ["19-1"], "question": "약호의 명칭\n⑴ CNCV-W                       ⑵ CV1", "answer": "⑴ 동심중성선 수밀형 전력케이블\n⑵ 0.6/1 [kV] 가교 폴리에틸렌 절연 비닐 시스 케이블", "q_image": "", "a_image": ""}, {"id": "q_13_2", "chapter": "q", "type": "2", "number": 13, "years": ["08-2", "09-4"], "question": "전선 접속의 구체적 방법\n「동전선의 접속에서 직선 맞대기용 슬리브(B형)에 의한\n압착접속법은 ( ① ) 및 ( ② )에 적용된다.」", "answer": "① 단선\n② 연선", "q_image": "", "a_image": ""}, {"id": "q_14_1", "chapter": "q", "type": "1", "number": 14, "years": ["08-1"], "question": "전선 접속의 구체적인 방법에서 슬리브에 의한 접속방법 (*참고서㉙)", "answer": "① S형 슬리브에 의한 직선 접속\n② S형 슬리브에 의한 분기 접속\n③ 매킹타이어 슬리브에 의한 직선 접속", "q_image": "", "a_image": ""}, {"id": "q_15_1", "chapter": "q", "type": "1", "number": 15, "years": ["20-1"], "question": "전선의 접속방법 중 동전선의 접속에서 직선접속의 종류 (2가지)", "answer": "① 가는 단선 (6[㎟] 이하)의 직선접속 (트위스트조인트)\n② 직선 맞대기용 슬리브(B형)에 의한 압착접속", "q_image": "", "a_image": ""}, {"id": "q_16_2", "chapter": "q", "type": "2", "number": 16, "years": ["03-4"], "question": "22.9 [kV-Y] 지중인입용으로 사용하는 전력 케이블", "answer": "CNCV-W 케이블 (수밀형) 또는 TR CNCV-W 케이블 (트리억제형)", "q_image": "", "a_image": ""}, {"id": "q_17_2", "chapter": "q", "type": "2", "number": 17, "years": ["02-4"], "question": "22.9 [kV] 지중케이블 접속방법 (4가지)", "answer": "직선접속, 분기접속, 종단접속, 엘보접속", "q_image": "", "a_image": ""}, {"id": "q_18_2", "chapter": "q", "type": "2", "number": 18, "years": ["19-1"], "question": "승강로 및 승강기에 시설하는\n절연전선 및 이동케이블의 동전선의 최소 굵기 (*참고서◯55 )\n· 절연전선\n· 이동케이블", "answer": "· 절연전선 : 1.5 ㎟\n· 이동케이블 : 0.75 ㎟", "q_image": "", "a_image": ""}, {"id": "q_19_2", "chapter": "q", "type": "2", "number": 19, "years": ["21-4"], "question": "전선 명칭에 대한 약호\n⑴ 인입용 비닐 절연전선 2개 꼬임\n⑵ 인입용 비닐 절연전선 2심 평형\n⑶ 옥외용 비닐 절연전선\n⑷ 0.6/1 [kV] 비닐절연 비닐캡타이어 케이블\n⑸ 450/750 [V] 저독성 난연 가교폴리올레핀 절연전선", "answer": "⑴ DV 2R\n⑵ DV 2F\n⑶ OW\n⑷ VCT\n⑸ HFIX", "q_image": "", "a_image": ""}, {"id": "q_20_2", "chapter": "q", "type": "2", "number": 20, "years": ["22-1"], "question": "⑴ 0.6/1 [kV] PN\n⑵ DR 2F\n⑶ 450/750 [V] HFIO", "answer": "⑴ 0.6/1 [kV] EP 고무 절연 클로로프렌 외장 케이블\n⑵ 인입용 고무 절연전선 2심 평형\n⑶ 450/750[V] 저독성 난연 폴리올레핀 절연전선", "q_image": "", "a_image": ""}, {"id": "q_21_4", "chapter": "q", "type": "4", "number": 21, "years": ["24-1"], "question": "보호도체의 최소 단면적의 기준", "answer": " ", "q_image": "q_21_4.png", "a_image": "q_21_4.png"}, {"id": "q_22_4", "chapter": "q", "type": "4", "number": 22, "years": ["21-1"], "question": "전선 및 케이블의 구분에 따른 배선설비의 공사방법에 대한 표", "answer": " ", "q_image": "q_22_4.png", "a_image": "q_22_4.png"}, {"id": "q_23_4", "chapter": "q", "type": "4", "number": 23, "years": ["17-4", "24-2"], "question": "전선의 병렬사용에 대한 설명", "answer": " ", "q_image": "q_23_4.png", "a_image": "q_23_4.png"}, {"id": "q_24_1", "chapter": "q", "type": "1", "number": 24, "years": ["03-2", "07-1", "08-2", "18-2"], "question": "옥내에서 전선을 병렬로 사용하는 경우의 원칙 (5가지)", "answer": "① 전선의 굵기는 동 50[mm2] 이상 또는 알루미늄 70[mm2]이상일 것\n② 동일한 도체, 동일한 굵기, 동일한 길이 일 것\n③ 병렬로 사용하는 전선은 각각의 퓨즈를 장착하지 말 것\n④ 금속관 안에 전자적 불평형이 생기지 않도록 시설할 것\n⑤ 같은 극의 각 전선은 동일한 터미널러그에 완전히 접속할 것", "q_image": "", "a_image": ""}, {"id": "q_25_1", "chapter": "q", "type": "1", "number": 25, "years": ["02-4", "05-4", "06-4", "11-4"], "question": "전선로 부근이나 애자 부근에 임계전압 이상이 가해지면 전선로나 애자 부근에 공기의 절연이 부분적으로 파괴되는 현상의 명칭과 그 현상의 방지 대책 (3가지)", "answer": "· 명칭 : 코로나 현상\n· 대책\n① 굵은전선을 사용한다. (ACSR, 중공연선 등)\n② 복도체 방식을 채택한다.\n③ 가선금구를 개량한다.", "q_image": "", "a_image": ""}, {"id": "q_26_2", "chapter": "q", "type": "2", "number": 26, "years": ["11-4"], "question": "복도체  방식을  사용하는 경우는  단도체  방식에 비하여  인덕턴스와\n정전용량이 몇 [%] 증가 또는 감소하는지 수치를 사용하여 설명", "answer": "· 인덕턴스 : 20~30 [%] 감소\n· 정전용량 : 20~30 [%] 증가", "q_image": "", "a_image": ""}, {"id": "q_27_4", "chapter": "q", "type": "4", "number": 27, "years": ["14-1"], "question": "저압 옥내배선에 사용하는 전선은 단면적 ( ① )[㎟] 이상의 연동선이어야 한다. 다만, 옥내배선의 사용전압이 400[V] 이하의 경우로 전광표시장치 기타 이와 유사한 장치 또는 제어회로 등의 배선에는 단면적 ( ② )[㎟] 이상의 연동선 또는 ( ③ )[㎟] 이상의 다심케이블 또는 다심 캡타이어케이블을 사용하고, 진열장 내의 배선공사에는 단면적 ( ④ )[㎟] 이상의 코드 또는 캡타이어케이블을 사용하여야 한다.", "answer": "① 2.5\n② 1.5\n③ 0.75\n④ 0.75", "q_image": "", "a_image": ""}, {"id": "q_28_2", "chapter": "q", "type": "2", "number": 28, "years": ["18-4"], "question": "고압 옥내배선 시설 공사법", "answer": "① 애자사용배선\n② 케이블 배선\n③ 케이블 트레이 배선", "q_image": "", "a_image": ""}, {"id": "q_29_2", "chapter": "q", "type": "2", "number": 29, "years": ["01-2", "13-1", "15-4"], "question": "[옥내 배선도를 작성하는 기본 순서]\n① 점멸기의 위치를 평면도에 표시한다.\n② 전등, 전열기, 전동기의 전압별 부하 집계표로 분기 회로수를 결정한다.\n③ 건물의 평면도 준비\n④ 각 부분의 배선에 전선의 종류, 굵기, 전선수를 표시\n⑤ 전기 사용기계, 기구를 심벌을 써서 위치를 표시한다.", "answer": "③ → ⑤ → ② → ① → ④", "q_image": "", "a_image": ""}, {"id": "q_30_4", "chapter": "q", "type": "4", "number": 30, "years": ["23-2"], "question": "사람이 상시 통행하는 터널 안의 배선의 시설기준\n공칭단면적 ( ① )[㎟] 의 연동선과 동등 이상의 세기 및 굵기의 절연전선 (옥외용 비닐절연전선 및 인입용 비닐절연전선을 제외한다.)을 애자공사에 의하여 시설하고 또한 이를 노면 상 ( ② )[m] 이상의 높이로 할 것.\n전로에는 터널의 입구에 가까운 곳에 전용 ( ③ )를 시설할 것.", "answer": "① 2.5\n② 2.5\n③ 개폐기", "q_image": "", "a_image": ""}, {"id": "q_31_4", "chapter": "q", "type": "4", "number": 31, "years": ["12-2"], "question": "가공지선은 ( ① )에 ( ② )에 대한 ( ③ )용 으로서 송전선로 지지물 최상부에 설치한다.", "answer": "① 송전선\n② 뇌격\n③ 차폐", "q_image": "", "a_image": ""}, {"id": "q_32_4", "chapter": "q", "type": "4", "number": 32, "years": ["12-4"], "question": "가공 송전선로 가설에 있어서 전선 매달기 순서는\n상부로부터 ( ① ), ( ② )의 순으로 해야하고,\n2회선 이상의 대칭배열의 경우 ( ③ ) 완   에 전선을 동시에 전선 매달기 작업을 시행하며,\n1회선 수평배열의 경우 ( ④ ), ( ⑤ )의 순서로 매달기를 한다.", "answer": "① 가공지선\n② 전선(전력선)\n③ 좌우\n④ 양 외선\n⑤ 중성선", "q_image": "", "a_image": ""}, {"id": "q_33_4", "chapter": "q", "type": "4", "number": 33, "years": ["15-1"], "question": "가공송전선로의 경우 높이 ( ① ) [m] 이상인 경우 철탑에 대해 항공표시구를 ( ② )에 취부하고, ( ③ )는 철탑 높이 및 비행구역에 따라 취부한다.", "answer": "① 60\n② 가공지선\n③ 항공장애 표시등", "q_image": "", "a_image": ""}, {"id": "q_34_2", "chapter": "q", "type": "2", "number": 34, "years": ["02-1", "02-2", "16-2"], "question": "[가공 배전선로에서 전선 가선 시 소요량 계산법]\n· 고저차가 없는 경우\n· 고저차가 심한 경우", "answer": "· 고저차가 심한 경우 : 선로 긍장 × 전선 조수 × 1.03\n· 고저차가 없는 경우 : 선로 긍장 × 전선 조수 × 1.02", "q_image": "", "a_image": ""}, {"id": "q_35_2", "chapter": "q", "type": "2", "number": 35, "years": ["06-4"], "question": "전선을 철거할 때의 실 회수량 산출", "answer": "선로 긍장 × 전선 조수", "q_image": "", "a_image": ""}, {"id": "q_36_2", "chapter": "q", "type": "2", "number": 36, "years": ["04-2"], "question": "﻿전선의 종류에서 용도는 특고압전압선 규격은 32, 58, 95, 160[㎟]이며 약호는 특고압 ACSR-OC 이다. 이 전선의 정확한 명칭은?", "answer": "옥외용 강심 알루미늄도체 가교 폴리에틸렌 절연전선", "q_image": "", "a_image": ""}, {"id": "r_1_2", "chapter": "r", "type": "2", "number": 1, "years": ["05-2"], "question": "심야전력기기의 인입구 장치 부근의 배선 어떤 경우의 시설인가?", "answer": "정액제·종량제 병용", "q_image": "r_1_2.png", "a_image": ""}, {"id": "r_2_2", "chapter": "r", "type": "2", "number": 2, "years": ["06-1"], "question": "심야 전력용 기기를 정액제로 하는 경우 인입구 장치 배선에서 각 명칭", "answer": "ⓐ : 타임스위치 (TS)\nⓑ : 전력량계 (WH)", "q_image": "r_2_2.png", "a_image": ""}, {"id": "r_3_2", "chapter": "r", "type": "2", "number": 3, "years": ["16-2", "18-4"], "question": "심야전력기기의 인입구 장치 부근의 배선", "answer": "정액제·종량제 병용", "q_image": "r_3_2.png", "a_image": ""}, {"id": "s_1_2", "chapter": "s", "type": "2", "number": 1, "years": ["14-4"], "question": "고압  배전계통의  배전방식  중  사고가  났을  때  정전  범위를  가장\n좁게 할 수 있는 배전 방식", "answer": "망상식(네트워크) 배전 방식", "q_image": "", "a_image": ""}, {"id": "s_2_1", "chapter": "s", "type": "1", "number": 2, "years": ["19-4", "22-2"], "question": "Spot Netwark 수전방식의 특징 (3가지)", "answer": "① 무정전 전원 공급이 가능하다.\n② 기기 이용률이 좋아진다.\n③ 전압 변동률이 적다.\n④ 전력 손실이 감소한다.\n⑤ 부하기기 증가에 따른 적응성이 우수하다.\n⑥ 2차 변전소 수량을 줄일 수 있다.", "q_image": "", "a_image": ""}, {"id": "s_3_2", "chapter": "s", "type": "2", "number": 3, "years": ["20-1", "23-1"], "question": "동일 변전소로부터 인출되는 2회선 이상의 고압 배전선에 접속되는\n변압기 2차측을 모두 동일 저압선에 연계하는 공급방식으로\n1차측 배전선 또는 변압기에 고장이 발생해도 다른 건전설비에 의\n하여 무정전 전원공급이 가능하고 공급신뢰도가 높은 배전방식", "answer": "스폿 네트워크 배전방식", "q_image": "", "a_image": ""}, {"id": "s_4_1", "chapter": "s", "type": "1", "number": 4, "years": ["23-2"], "question": "고압 지중 배전 계통에서 사용하는 수전 방식으로 전력회사에서 2~4회선을 공급받아 병렬 운전하는 수전방식\n⑴ 명칭\n⑵ 장점 (4가지)", "answer": "⑴ 스폿 네트워크\n⑵ 장점\n① 무정전 전원 공급이 가능하다.\n② 기기의 이용률이 좋아진다.\n③ 전압 변동률이 적다.\n④ 전력손실이 감소한다.", "q_image": "s_4_1.png", "a_image": ""}, {"id": "s_5_7", "chapter": "s", "type": "7", "number": 5, "years": ["13-1"], "question": "전등 수용가에 대한 배전방식 비교에서 3상 4선식 배전방식의 장·단점 (3가지 씩)", "answer": "⑴ 장점\n① 공급능력 최대\n② 경제적 배전방식\n③ 배전설비의 단순화\n⑵ 단점\n① 부하 불평형 발생\n② 동력 부하 기동 시 플리커 발생 우려\n③ 중성선 단선 시 이상전압 유입", "q_image": "", "a_image": ""}, {"id": "s_6_7", "chapter": "s", "type": "7", "number": 6, "years": ["11-1", "16-1"], "question": "송전방식 중 직류송전방식의 장점 (3가지)", "answer": "[장점]\n① 절연레벨을 낮출 수 있다.\n② 선로의 리액턴스, 위상각이 없으므로 안정도가 높다.\n③ 무효전력 및 송전손실이 없고, 역률이 항상 1이므로 송전효율이 좋다.\n④ 도체의 표피효과가 없다.\n⑤ 충전전류와 유전체 손을 고려하지 않아도 된다.\n[단점]\n① 변압이 어렵다.\n② 직류용 차단기가 개발되어 있지 않다.\n③ 고조파 억제 대책이 필요하다.\n④ 직, 교류 변환장치가 필요하다.", "q_image": "", "a_image": ""}, {"id": "t_1_1", "chapter": "t", "type": "1", "number": 1, "years": ["08-2", "24-2"], "question": "전기설비에 있어서 감전예방의 종류 중\n직접접촉예방에서 기본 보호방법 (4가지)", "answer": "① 충전부의 절연에 의한 보호\n② 격벽 또는 외함에 의한 보호\n③ 장애물에 의한 보호\n④ 손의 접근 한계 외측 시설에 의한 보호\n⑤ 누전차단기에 의한 추가 보호", "q_image": "", "a_image": ""}, {"id": "t_2_1", "chapter": "t", "type": "1", "number": 2, "years": ["12-1", "16-1"], "question": "전기설비에 있어서 감전예방의 종류 중\n간접접촉예방을 위한 보호 방법", "answer": "① 전원의 자동차단에 의한 보호\n② Ⅱ급 기기의 사용 또는 이것과 동등이상의 절연에 의한 보호\n③ 비도전성 장소에 의한 보호\n④ 비접지 국부 등전위본딩에 의한 보호\n⑤ 전기적 분리에 의한 보호", "q_image": "", "a_image": ""}, {"id": "t_3_2", "chapter": "t", "type": "2", "number": 3, "years": ["17-2"], "question": "전기설비에 있어서 감전예방은 직접접촉예방과 간접접촉예방이 있으며,\n간접접촉예방 중 전원의 자동차단에 의한 인체보호를 위하여 전기회로 또는 전기기기의 충전부와 노출 도전성 부분 또는 보호선 간에 고장이 발생하여 교류 몇 [V] (실효값)를 초과하는\n접촉전압이 발생한 경우에 그 전원을 자동적으로 차단하여야 하는가?", "answer": "50 [V]", "q_image": "", "a_image": ""}, {"id": "t_4_1", "chapter": "t", "type": "1", "number": 4, "years": ["13-4"], "question": "변압기나 배전함 외함의 보호등급에서 ①, ②, ③ 각각의 의미\nIP ① ② ③", "answer": "① 외부분진에 대한 보호등급\n② 방수에 대한 보호등급\n③ 위험한 부분으로의 접근에 대한 보호등급", "q_image": "", "a_image": ""}, {"id": "t_5_1", "chapter": "t", "type": "1", "number": 5, "years": ["08-1", "15-4"], "question": "전기설비의 방폭에서 방폭구조의 종류 (5가지)", "answer": "① 내압 방폭구조 (d)\n② 유입 방폭구조 (o)\n③ 압력 방폭구조 (p)\n④ 안전증 방폭구조 (e)\n⑤ 본질안전 방폭구조 (ia, ib)\n⑥ 특수 방폭구조 (s)", "q_image": "", "a_image": ""}, {"id": "t_6_1", "chapter": "t", "type": "1", "number": 6, "years": ["08-1", "16-2"], "question": "전기기기의 선정과 시설에 관한 일반사항에서 배선설비의 선정과 시공 시 고려하여야 할 사항 (5가지)", "answer": "① 감전에 대한 보호\n② 열적 영향에 대한 보호\n③ 과전류에 대한 보호\n④ 고장전류에 대한 보호\n⑤ 과전압에 대한 보호", "q_image": "", "a_image": ""}, {"id": "t_7_8", "chapter": "t", "type": "8", "number": 7, "years": ["11-4"], "question": "전극식 온천 온수기의 결선도\n⑴ 그림에서 ①의 명칭\n⑵ 전극식 온천 온수기의 사용전압은 몇 [V] 이하로 해야 하는가?\n⑶ 절연변압기는 교류 2000[V] 시험전압을 하나의 권선과\n다른 권선 철심 및 외함 사이에 연속적으로 몇 분간 가하여\n절연내력을 시험할 경우 이에 견디어야 하는가?", "answer": "⑴ 차폐장치\n⑵ 400 [V]\n⑶ 1[분]", "q_image": "t_7_8.png", "a_image": ""}, {"id": "u_1_4", "chapter": "u", "type": "4", "number": 1, "years": ["03-2", "06-4", "10-2", "11-1", "12-4", "13-2", "14-1", "20-2", "22-1", "22-4", "24-2"], "question": "표준품셈 할증률", "answer": " ", "q_image": "u_1_4.png", "a_image": "u_1_4.png"}, {"id": "u_2_4", "chapter": "u", "type": "4", "number": 2, "years": ["22-2"], "question": "전기부문 표준품셈에 따른 고소작업에 대한 할증률", "answer": " ", "q_image": "u_2_4.png", "a_image": "u_2_4.png"}, {"id": "u_3_4", "chapter": "u", "type": "4", "number": 3, "years": ["06-2", "08-1", "08-4", "14-4", "24-1"], "question": "전기공사에서 건물(지상층) 층수별 물량산출 시 건물 층수에 따라\n할증률이 규정 적용 된다. 건물 층수 별 할증률은?", "answer": " ", "q_image": "u_3_4.png", "a_image": "u_3_4.png"}, {"id": "u_4_3", "chapter": "u", "type": "3", "number": 4, "years": ["01-2", "06-2", "08-4", "15-2", "22-2"], "question": "품에서 규정된 소운반의 뜻은?", "answer": "20[m] 이내의 수평거리를 말하며, 경사면의 소운반 거리는 직고 1[m] 수평거리 6[m]의 비율로 본다.", "q_image": "", "a_image": ""}, {"id": "u_5_3", "chapter": "u", "type": "3", "number": 5, "years": ["03-4", "19-1", "22-4"], "question": "철거손실률에 대하여 설명", "answer": "전기설비공사에서 철거 작업 시 발생하는 폐자재를 환입할 때 재료의 파손, 손실, 망실 및 일부 부식 등에 의한 손실률", "q_image": "", "a_image": ""}, {"id": "u_6_3", "chapter": "u", "type": "3", "number": 6, "years": ["04-2", "04-4", "06-2", "10-1", "16-2", "23-2"], "question": "공구손료에 대하여 설명", "answer": "일반공구 및 시험용 계측기구류의 손료로서 공사 중 상시 일반적으로 사용하는 것을 말하며, 직접 노무비(노임할증 제외)의 3[%]까지 계상한다.", "q_image": "", "a_image": ""}, {"id": "u_7_2", "chapter": "u", "type": "2", "number": 7, "years": ["06-2", "08-4"], "question": "공구손료에서 Chain Hoist, Block, Pipe Expander, Straight Edge,\n절연 내압 시험기, 변압기, 탈기기, 자동전압기조정기, Synchroscope,  Potentlometer 등  특수  공구  및  특수시험  검사용\n기구류의 손료 산정은 어느 손료에 준하여 산정하는가?", "answer": "경장비 손료", "q_image": "", "a_image": ""}, {"id": "u_8_2", "chapter": "u", "type": "2", "number": 8, "years": ["11-4"], "question": "공사원가계산(총원가) 시 원가계산의 비목(구성)", "answer": "재료비, 노무비, 경비, 일반관리비, 이윤", "q_image": "", "a_image": ""}, {"id": "u_9_2", "chapter": "u", "type": "2", "number": 9, "years": ["05-2", "24-1"], "question": "공사원가라 함은 공사시공 과정에서 발생한 무엇의 합계액을\n말하는가? (*참고서⑳)", "answer": "재료비, 노무비, 경비", "q_image": "", "a_image": ""}, {"id": "u_10_4", "chapter": "u", "type": "4", "number": 10, "years": ["02-1"], "question": "물가변동으로 인한 공사비 변경\n「공사계약을 체결한 날로부터 ( ① )일 이상 경과하고, 산출된 품목조정률 또는 지수조정률이 ( ② )분의 ( ③ )이상 증감된 때 시행하는 공사비 변경을 말한다.」", "answer": "① 90\n② 100\n③ 3", "q_image": "", "a_image": ""}, {"id": "u_11_2", "chapter": "u", "type": "2", "number": 11, "years": ["08-1"], "question": "자재 계획 단계의 적합한 순서\n⑴ 원 단위 산정\n⑵ 사용 계획\n⑶ 구매 계획\n⑷ 재고 계획", "answer": "⑴ → ⑵ → ⑷ → ⑶", "q_image": "", "a_image": ""}, {"id": "u_12_4", "chapter": "u", "type": "4", "number": 12, "years": ["07-2", "09-1"], "question": "설계서의 작성순서에서 변경 설계를 하려고 할 때\n빈칸에 알맞은 용어\n표지 → 목차 → 변경이유서 → ( ① ) → 특별시방서 → ( ② )\n→ 동원인원 계획표 → ( ③ ) → 일위대가표 → ( ④ ) →\n중기사용료 및 잡비계산서 → ( ⑤ ) → 설계도면 → 이하생략", "answer": "① 일반시방서\n② 예정공정표\n③ 내역서\n④ 자재표\n⑤ 수량계산서", "q_image": "", "a_image": ""}, {"id": "u_13_1", "chapter": "u", "type": "1", "number": 13, "years": ["21-2"], "question": "전기안전관리법 시행규칙에 따른 자가용 전기설비(1500[kW])의 신규 설치 시 제출해야 할 공사계획 신고서 (5가지)\n(단, 부득이한 공사 및 원자력발전소의 경우 제외)", "answer": "① 공사계획서\n② 공사공정표\n③ 기술 시방서\n④ 전기안전공사 사전기술검토서\n⑤ 설계도서", "q_image": "", "a_image": ""}, {"id": "u_14_1", "chapter": "u", "type": "1", "number": 14, "years": ["22-2"], "question": "전력시설물 공사감리업무 수행지침에 따라 감리용역 착수단계에서 감리업자가 발주자의 승인을 받아야 하는 착수신고서 (3가지)", "answer": "① 감리업무 수행계획서\n② 감리비 산출 내역서\n③ 상주, 비상주 감리원 배치계획서와 감리원의 경력 확인서\n④ 감리원 조직 구성내용과 감리원별 투입기간 및 담당업무", "q_image": "", "a_image": ""}, {"id": "u_15_1", "chapter": "u", "type": "1", "number": 15, "years": ["08-4"], "question": "시공계획서 작성 시 현장조건의 검토사항 중 선로 경과지 주변 또 는 관련되는 공사에 대해서 조사하여야 하는 사항 (5가지)", "answer": "① 현장의 지형 및 토양상태\n② 농지, 농원,   공원, 문화재, 천연기념물 지정구역\n③ 설비의 활용성 및 안정성 확보, 재해요인의 잠재여부\n④ 인가 밀집지역이나 향후 지역발전 여건 등을 감안한 경과지 타당성 여부\n⑤ 시공 후 책임소재 등 이해관계가 야기될 수 있는 문제점 조사", "q_image": "", "a_image": ""}, {"id": "u_16_2", "chapter": "u", "type": "2", "number": 16, "years": ["21-4"], "question": "전기부문  표준품셈에  따라  PERT/CPM  공정계획에  의한  공기산출\n결과  정상작업(정상공기)으로는  불가능하여  야간작업을  할  경우나 공사  성질  상  부득이  야간작업을  하여야  할  경우에는  품을  몇[%]\n까지 가산할 수 있는가?", "answer": "25 [%]", "q_image": "", "a_image": ""}, {"id": "u_17_4", "chapter": "u", "type": "4", "number": 17, "years": ["06-1", "11-2", "12-2", "16-1", "24-2"], "question": "건+B365:B381물 종류에 대응한 표준부하의 값", "answer": "① 10\n② 20\n③ 30\n④ 40", "q_image": "u_17_4.png", "a_image": ""}, {"id": "u_18_1", "chapter": "u", "type": "1", "number": 18, "years": ["06-2", "08-4"], "question": "20층 짜리 현대식 빌딩의 옥내조명기구로 형광등을 사용하고자 한다.\n천장은 2중 천장이며 형광등은 매입으로 부착하고자 한다. 형광등 배치위치 결정 시 고려하여야 할\n천장에 부착되는 건축 설비 (4가지)", "answer": "공기조화설비, 냉난방설비, 급·배수설비, 오수설비", "q_image": "", "a_image": ""}, {"id": "v_1_2", "chapter": "v", "type": "2", "number": 1, "years": ["14-2", "19-2"], "question": "아래에 설명하는 용어의 명칭\n‘비선형 부하에 의해 고조파의 영향을 받는 기계기구(변압기 등)가\n과열현상 없이 부하에 전력을 안정적으로 공급해 줄 수 있는 능력’", "answer": "K-Factor", "q_image": "", "a_image": ""}, {"id": "v_2_3", "chapter": "v", "type": "3", "number": 2, "years": ["14-4", "20-3"], "question": "BIL이란 무엇인지 설명하시오.", "answer": "기준충격절연강도로서 뇌임펄스 내전압 시험값으로\n절연레벨의 기준을 정하는데 적용된다.", "q_image": "", "a_image": ""}, {"id": "v_3_3", "chapter": "v", "type": "3", "number": 3, "years": ["15-1"], "question": "부분방전에 대하여 설명   (*참고서㊽)", "answer": "전극과 전극사이에서 일어나지 않고 한 부분에 생기는 방전을 칭함", "q_image": "", "a_image": ""}, {"id": "v_4_1", "chapter": "v", "type": "1", "number": 4, "years": ["20-1"], "question": "SCADA의 기능을 (3가지)", "answer": "① 원방 감시 기능\n② 원격 제어 기능\n③ 원격 측정 기능", "q_image": "", "a_image": ""}, {"id": "v_5_2", "chapter": "v", "type": "2", "number": 5, "years": ["24-3"], "question": "오실로스코프 B-H 곡선에서\n수평 편광판은 ( ① )에 비례한 전압이 나오고,\n수직 편광판에서는 ( ② )에 비례한 전압이 나타난다.", "answer": "① 자계의 세기 H\n② 자속 밀도 B", "q_image": "", "a_image": ""}, {"id": "v_6_2", "chapter": "v", "type": "2", "number": 6, "years": ["23-2"], "question": "전기방식의 명칭", "answer": "외부전원법", "q_image": "v_6_2.png", "a_image": ""}, {"id": "v_7_3", "chapter": "v", "type": "3", "number": 7, "years": ["16-2"], "question": "분기회로의 용어의 정의를 설명하시오.", "answer": "간선에 분기하여 분기과전류 차단기를 거쳐서 부하에 이르는 사이의 배선을 말한다.", "q_image": "", "a_image": ""}, {"id": "v_8_1", "chapter": "v", "type": "1", "number": 8, "years": ["06-1"], "question": "정전 작업을 개시할 때, 정전의 5단계", "answer": "1단계 : 작업 전 전원 차단\n2단계 : 전원 투입의 방지 (시건장치 및 통전   지 표시판 설치)\n3단계 : 작업장소의 무전압 여부 확인 (잔류전하방전→검전기 사용)\n4단계 : 단락접지 (단락접지기구 사용)\n5단계 : 작업장소의 보호", "q_image": "", "a_image": ""}, {"id": "w_1_4", "chapter": "w", "type": "4", "number": 1, "years": ["01-1", "16-1", "20-3", "23-4"], "question": "[2련 내장 애자]", "answer": "① 앵커쇄클\n② 체인링크\n③ 삼각요크\n④ 볼 크레비스\n⑤ 현수애자\n⑥ 소켓 크레비스\n⑦ 압축형 인류 클램프", "q_image": "w_1_4.png", "a_image": ""}, {"id": "w_2_4", "chapter": "w", "type": "4", "number": 2, "years": ["01-2", "10-4", "16-2", "24-3"], "question": "[경완철에서 현수애자 설치]", "answer": "① 경완철\n② 소켓아이\n③ 볼쇄클\n④ 현수애자\n⑤ 데드 앤드 클램프\n⑥ 전선", "q_image": "w_2_4.png", "a_image": ""}, {"id": "w_3_4", "chapter": "w", "type": "4", "number": 3, "years": ["01-4", "06-2", "22-4"], "question": "[지선밴드를 이용한 현수애자 설치]", "answer": "① 지선밴드\n② 볼 아이\n③ 현수 애자\n④ 소켓 아이\n⑤ 데드 엔드 클램프", "q_image": "w_3_4.png", "a_image": ""}, {"id": "w_4_4", "chapter": "w", "type": "4", "number": 4, "years": ["07-2", "20-4"], "question": "154[kV] 송전선로의 1련 현수애자 장치도", "answer": "① 애자장치 U볼트\n② 앵커쇄클\n③ 볼아이\n④ Y크레비스볼\n⑤ 현수애자\n⑥ 소켓 아이\n⑦ 현수클램프\n⑧ 아머로드", "q_image": "w_4_4.png", "a_image": ""}, {"id": "w_5_4", "chapter": "w", "type": "4", "number": 5, "years": ["02-4", "07-1", "18-2", "21-1"], "question": "[장간형 현수애자 설치]", "answer": "① 앵카쇄클\n② 볼크레비스\n③ 장간형 현수애자\n④ 소켓아이\n⑤ 데드 엔드 클램프", "q_image": "w_5_4.png", "a_image": ""}, {"id": "w_6_4", "chapter": "w", "type": "4", "number": 6, "years": ["02-2", "05-4", "11-4", "24-2"], "question": "[내장애자에서 각 부분별 명칭]", "answer": "1. 현수애자\n2. ㄱ형 완철\n3. 볼 아이\n4. 소켓 아이", "q_image": "w_6_4.png", "a_image": ""}, {"id": "w_7_4", "chapter": "w", "type": "4", "number": 7, "years": ["22-1"], "question": "1련 내장 애자 장치(역조형)", "answer": "① 앵커 쇄클\n② 소켓 아이\n③ 현수 애자\n④ 볼 크레비스\n⑤ 점퍼 터미널", "q_image": "w_7_4.png", "a_image": ""}, {"id": "w_8_4", "chapter": "w", "type": "4", "number": 8, "years": ["16-4", "23-1"], "question": "각 장주의 명칭", "answer": "⑴ 보통장주\n⑵ 랙크장주\n⑶ 창출장주\n⑷ 편출용 D형 랙크장주\n⑸ 편출장주", "q_image": "w_8_4.png", "a_image": ""}, {"id": "w_9_4", "chapter": "w", "type": "4", "number": 9, "years": ["09-1", "22-4"], "question": "공칭전압 22.9 [kV], 선심수 3,\n특고압 수밀형 가공 케이블 (ABC-W)의 단면도에서 각 번호별 명칭", "answer": "① 도체                            ② 내부 반도전층\n③ 절연층                         ④ 외부 반도전층\n⑤ 시스                            ⑥ 중성선", "q_image": "w_9_4.png", "a_image": ""}, {"id": "w_10_4", "chapter": "w", "type": "4", "number": 10, "years": ["14-2", "16-4", "20-3", "21-1", "24-1"], "question": "각 철탑의 명칭을 쓰시오", "answer": "(1) 사각 철탑 문형 철탑 \n(2) 방형 철탑\n(3) 우두형 철탑\n(4) 문형 철탑\n(5) 회전형 철탑\n(6) MC 철탑", "q_image": "w_10_4.png", "a_image": ""}, {"id": "w_11_4", "chapter": "w", "type": "4", "number": 11, "years": ["12-4", "20-4"], "question": "철탑 각 부분의 명칭", "answer": "(차례대로) 철탑정부, 암, 주주재, 거싯 플레이트, 사재, 주각재, 주체부, 상판부, 앵커재, 앵커블록", "q_image": "w_11_4.png", "a_image": ""}, {"id": "w_12_4", "chapter": "w", "type": "4", "number": 12, "years": ["15-4"], "question": "가공인입선의 인입선 접속점 및 인입구 배선", "answer": "① PVC 애자\n② 전선퓨즈\n③ DV 전선 (인입용 비닐절연 전선)\n④ 완철지선\n⑤ 랙크", "q_image": "w_12_4.png", "a_image": ""}, {"id": "x_1_4", "chapter": "x", "type": "4", "number": 1, "years": ["02-4", "04-1", "05-2", "06-1", "07-2", "07-4", "19-4"], "question": "변압기 공사 시공 흐름도", "answer": "﻿① 분기고리 설치\n② COS 설치\n③ 변압기 설치\n④ 변압기 2차측 결선\n⑤ 외함 접지선 연결\n⑥ Fuse Link 조립\n⑦ COS 투입", "q_image": "x_1_4.png", "a_image": ""}, {"id": "x_2_4", "chapter": "x", "type": "4", "number": 2, "years": ["﻿03-2", "07-1", "17-2", "24-1"], "question": "", "answer": "﻿⑴ 전선펴기\n⑵ 직선 접속\n⑶ 이도 조정 및 고정\n⑷ 바인드 시공\n⑸ 전선 접속\n⑹ (충전부) 절연처리", "q_image": "x_2_4.png", "a_image": ""}, {"id": "x_3_4", "chapter": "x", "type": "4", "number": 3, "years": ["03-4", "08-4"], "question": "", "answer": "﻿⑴ 가옥측 인입선 장악구 설치\n⑵ 전주측 인입선 지지구 설치\n⑶ 인입선 이도조정", "q_image": "x_3_4.png", "a_image": ""}, {"id": "x_4_4", "chapter": "x", "type": "4", "number": 4, "years": ["15-1"], "question": "배전시공에서 피뢰기 공사 시공 흐름도", "answer": "① 피뢰기 조립\n② 리드선 접속", "q_image": "x_4_4.png", "a_image": ""}, {"id": "x_5_4", "chapter": "x", "type": "4", "number": 5, "years": ["17-1"], "question": "지선, 지주 시공흐름선도", "answer": "① 지선애자 설치\n② 수평지선장력 조정", "q_image": "x_5_4.png", "a_image": ""}, {"id": "x_6_4", "chapter": "x", "type": "4", "number": 6, "years": ["21-4"], "question": "공사감리 업무에서 감리원의 검사업무 수행사항", "answer": "① 현장시공 완료\n② 시공관리 책임자 점검\n③ 검사요청서 제출\n④ 감리원 현장 검사\n⑤ 검사결과 통보", "q_image": "x_6_4.png", "a_image": ""}, {"id": "y_1_6", "chapter": "y", "type": "6", "number": 1, "years": ["01-4", "05-2", "07-4", "09-2"], "question": "완전한 정류회로가 되도록 완성하시오.", "answer": " ", "q_image": "y_1_6.png", "a_image": "y_1_6.png"}, {"id": "y_2_6", "chapter": "y", "type": "6", "number": 2, "years": ["13-2"], "question": "한 개의 전등을 3개소에서 점멸하고자 할 때, 3로 스위치 2개와 4로 스위치 1개를  이용하여 점멸할 수 있도록 회로도를 구성하시오.", "answer": " ", "q_image": "y_2_6.png", "a_image": "y_2_6.png"}, {"id": "y_3_6", "chapter": "y", "type": "6", "number": 3, "years": ["06-4"], "question": "3상 3선식의 전력량계 결선도이다.\n계기용 변압기와 변류기를 사용하여 사각형 내의 미완성 부분의 결선도를 완성하시오.", "answer": " ", "q_image": "y_3_6.png", "a_image": "y_3_6.png"}, {"id": "y_4_6", "chapter": "y", "type": "6", "number": 4, "years": ["12-4", "15-1", "21-1"], "question": "PT 및 CT를 조합한 경우의 3상 3선식 전력량계의 결선도를 접지를 포함하여 완성하시오.", "answer": " ", "q_image": "y_4_6.png", "a_image": "y_4_6.png"}, {"id": "y_5_6", "chapter": "y", "type": "6", "number": 5, "years": ["03-4"], "question": "3상 4선식 110/220 [V] (V결선)이다. 그림을 보고 실체도를 그리시오.", "answer": " ", "q_image": "y_5_6.png", "a_image": "y_5_6.png"}, {"id": "y_6_6", "chapter": "y", "type": "6", "number": 6, "years": ["12-1"], "question": "3상 간선에서 CT 및 PT를 사용하여 전압 및 전류를 측정하기 위한 결선도를 그리고 접지 표시를 하시오.", "answer": " ", "q_image": "y_6_6.png", "a_image": "y_6_6.png"}, {"id": "y_7_6", "chapter": "y", "type": "6", "number": 7, "years": ["10-2", "16-2", "24-2"], "question": "전력 수급용 계기용 변성기(MOF)의 단선도이다.\n복선도로 그리시오. (단, 전기방식은 3상 3선식이다.)", "answer": " ", "q_image": "y_7_6.png", "a_image": "y_7_6.png"}, {"id": "y_8_6", "chapter": "y", "type": "6", "number": 8, "years": ["01-4", "06-2", "07-4", "09-1", "20-1"], "question": "﻿그림 1에서, 그림 2에 경보장치를 추가로 설치한 미완성 전선 접속도를 복선도로 그리시오.\n단, 누전 경보기 내부 전선은 생략하고 단자 까지만 배선하며 영상 변류기는 WH와 KS 사이에 시설하는 것으로 하고, 경보장치의 전원단에는 별도의 개폐기를 취부한다. 또한, 경보기구(벨)도 포함하여 작성하도록 한다.", "answer": " ", "q_image": "y_8_6.png", "a_image": "y_8_6.png"}, {"id": "y_9_6", "chapter": "y", "type": "6", "number": 9, "years": ["09-4"], "question": "변압기 부하설비용량이 100[kVA] 미만의 고압 수전 전선접속도에서\n결선도를 완성하시오.\n단, 변압기는 Δ-Δ 결선으로 한다.", "answer": " ", "q_image": "y_9_6.png", "a_image": "y_9_6.png"}, {"id": "y_10_6", "chapter": "y", "type": "6", "number": 10, "years": ["03-1", "07-2"], "question": "농형 유도 전동기의 Y-Δ 기동, 리액터 기동 회로도를\n전기적으로 그리시오.", "answer": " ", "q_image": "", "a_image": "y_10_6.png"}, {"id": "y_11_6", "chapter": "y", "type": "6", "number": 11, "years": ["04-4"], "question": "서지 흡수기의 설치 위치도를 그리시오.\n단, 서지흡수기는 보호하고자 하는 기기 전단으로, 개폐서지를 발생하는 차단기 후단 부하측 사이에 설치한다.", "answer": " ", "q_image": "y_11_6.png", "a_image": "y_11_6.png"}, {"id": "y_12_6", "chapter": "y", "type": "6", "number": 12, "years": ["09-2"], "question": "3상 4선식 배전선로에서 단상변압기 2대가 있는 미완성 회로도이다.\n이것을 역V결선하여 2차에 3상 전원방식으로 결선하시오.", "answer": " ", "q_image": "y_12_6.png", "a_image": "y_12_6.png"}, {"id": "y_13_6", "chapter": "y", "type": "6", "number": 13, "years": ["04-2", "13-4", "21-1", "22-1"], "question": "87 계전기의 3상 결선도(차단기, 변압기 포함)를 완성하시오.", "answer": " ", "q_image": "y_13_6.png", "a_image": "y_13_6.png"}, {"id": "y_14_6", "chapter": "y", "type": "6", "number": 14, "years": ["02-2", "17-4", "20-4"], "question": "차동 전류계전기의 미완성 도면에 완성하시오.\n(단, 변류기 결선은 감극성을 기준으로 한다.)", "answer": " ", "q_image": "y_14_6.png", "a_image": "y_14_6.png"}, {"id": "z_1_4", "chapter": "z", "type": "4", "number": 1, "years": ["12-4", "18-1"], "question": "CB 1차측에 CT를, CB 2차측에 PT를 시설하는 경우의 수변전설비\n단선결선도이다.\n① ~ ⑨ 까지의 기호와 명칭을 같이 쓰시오.", "answer": " ", "q_image": "z_1_4.png", "a_image": "z_1_4.png"}, {"id": "z_2_6", "chapter": "z", "type": "6", "number": 2, "years": ["02-4", "09-1", "15-1", "16-4", "20-2", "21-2"], "question": "﻿22.9[kV-Y] 1000[kVA] 이하에 적용 가능한 특고압 간이 수전설비 표준결선도이다.\n⑴ 점선으로 표시 된 미완성 부분의 결선도를 완성하시오.\n(단, 자동고장구분개폐기, DS, LA, PF, MOF, 수전용 변압기, 전력량계만 사용한다.)\n﻿⑵ 22.9[kV-Y] 계통에서 지중 인입선으로 주로 사용하는 케이블 종류\n(2가지)", "answer": "⑵ CNCV-W 케이블 (수밀형)\nTR-CNCV-W 케이블 (트리억제형)", "q_image": "z_2_6.png", "a_image": "z_2_6.png"}, {"id": "z_3_2", "chapter": "z", "type": "2", "number": 3, "years": ["20-1"], "question": "도면의 단선결선도를 보고 물음에 답하시오.\n\n⑴  위  그림의  단선결선도는  22.9  [kV-Y]  계통의  몇  [kVA]  이하의 용량에만 적용하는 것인지 적으시오.\n⑵ 피뢰기의 수량을 적으시오.\n⑶ 지중인입선의 경우 22.9[kV-Y] 계통은 어떤 종류의 케이블을 사용하는지 적으시오.\n⑷ 수전용 변압기가 300 [kVA] 이하인 경우 PF 대신 사용할 수 있는 개폐기 (비대칭 차단 전류 10[kA] 이상)을 적으시오.", "answer": "(1) 1000 [kVA] 이하\n(2) 3개\n(3) CNCV-W 케이블 (수밀형), TR-CNCV-W 케이블 (트리억제형) \n(4) COS (컷아웃 스위치)", "q_image": "z_3_2.png", "a_image": ""}, {"id": "z_4_8", "chapter": "z", "type": "8", "number": 4, "years": ["01-1", "02-1", "02-4", "05-1"], "question": "22.9[kV-Y] 1000[kVA] 이하인 특고압 수전설비의 표준결선도 (단, CB 1차측에 PT를, CB 2차측에 CT를 시설하는 경우)", "answer": " ", "q_image": "z_4_8.png", "a_image": "z_4_8.png"}, {"id": "z_5_8", "chapter": "z", "type": "8", "number": 5, "years": ["08-4", "09-2", "11-2"], "question": "특고압 수전설비 결선도의 미완성 도면\n(단, CB 1차측에 CT를, CB 2차측에 PT를 시설하는 경우)", "answer": " ", "q_image": "z_5_8.png", "a_image": "z_5_8.png"}, {"id": "z_6_8", "chapter": "z", "type": "8", "number": 6, "years": ["07-4", "23-2"], "question": "수변전 설비 결선도를 이해하고 다음 물음에 답하시오.", "answer": " ", "q_image": "z_6_8.png", "a_image": "z_6_8.png"}, {"id": "z_7_6", "chapter": "z", "type": "6", "number": 7, "years": ["11-1"], "question": "특고압 수전설비에 대한 단선결선도 中\n변압기 3대로서 Δ-Δ , Δ-Y 결선도를 그리시오.", "answer": " ", "q_image": "z_7_6.png", "a_image": "z_7_6.png"}, {"id": "z_8_8", "chapter": "z", "type": "8", "number": 8, "years": ["12-2", "23-1"], "question": "3상 4선식 중성점 다중접지방식의 22.9[kV-Y] 배전선로의\n단선결선도\n⑴ 지중인입선의 경우 22.9[kV-Y]계통은 어떤 케이블을 사용하는가?\n⑵ MOF에서 규격이 13.2[kV]/110[V], 75/5[A]일 때 전기공급 규정에 의거 0.2급, 0.5급, 1.2급 중 어떤 급을 사용하는가?\n⑶ OCB의 명칭\n⑷ OCGR의 명칭\n⑸ DS의 명칭\n⑹ COS의 명칭\n⑺ TC의 명칭", "answer": "⑴ CNCV-W 케이블 (수밀형) 또는 TR CNCV-W (트리억제형)\n⑵ 0.5급\n⑶ 유입차단기\n⑷ 지락과전류계전기\n⑸ 단로기\n⑹ 컷아웃스위치\n⑺ 트립코일", "q_image": "", "a_image": ""}, {"id": "aa     let currentMode = 'study';

        "1": "가짓수",

        "6": "도식",
        "7": "장단점",
        "8": "소문제 결합"
    };
    
    function getYearNum(yStr) {
        const yr = parseInt(yStr.split('-')[0], 10);
        if (isNaN(yr)) return 0;
        return yr < 50 ? 2000 + yr : 1900 + yr;
    }
    
    function matchYear(q, condition) {
        if (!q.years || q.years.length === 0) return false;
        let match = false;
        q.years.forEach(y => {
            const yr = getYearNum(y);
            if (condition === 'after-2015' && yr >= 2015) match = true;
            if (condition === '2011-2015' && yr >= 2011 && yr <= 2015) match = true;
            if (condition === 'before-2011' && yr > 0 && yr < 2011) match = true;
            if (condition === 'recent-3' && yr >= 2024 && yr <= 2026) match = true;
        });
        return match;
    }

    function navTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0,0);
    }

    function selectMode(mode) {
        currentMode = mode;
        document.getElementById('mode-title').innerText = mode === 'study' ? '📖 공부 모드 설정' : '📝 시험 모드 설정';
        document.getElementById('btn-back-test').setAttribute('onclick', "navTo('screen-options')");
        navTo('screen-options');
    }
    
    function selectModeAndStart(type) {
        if(confirm("이 문제를 '시험 모드'로 푸시겠습니까?\n(취소를 누르면 '공부 모드'로 열립니다.)")) {
            currentMode = 'exam';
        } else {
            currentMode = 'study';
        }
        document.getElementById('btn-back-test').setAttribute('onclick', "navTo('screen-home')");
        startTest(type);
    }

    function searchWord() {
        const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
        if (!keyword) {
            alert("검색할 단어를 입력해주세요.");
            return;
        }
        const all = [...questionsData];
        const list = all.filter(q => {
            const qText = (q.question || "").toLowerCase();
            const aText = (q.answer || "").toLowerCase();
            return qText.includes(keyword) || aText.includes(keyword);
        });

        if (list.length === 0) {
            alert(`'${keyword}'에 해당하는 문제가 없습니다.`);
            return;
        }

        currentMode = 'study';
        currentList = list;
        document.getElementById('test-title').innerText = `🔍 검색 결과: "${keyword}" (${list.length}문제)`;
        document.getElementById('btn-back-test').setAttribute('onclick', "navTo('screen-home')");
        renderTest(list);
    }
    
    function openNote(noteType) {
        currentMode = noteType + '-note';
        let list = [];
        const all = [...questionsData];
        
        if (noteType === 'memory') {
            list = all.filter(q => {
                let state = JSON.parse(localStorage.getItem(q.id)) || {};
                return state.diff && state.diff !== '';
            });
            document.getElementById('test-title').innerText = '📚 암기 노트';
        } else if (noteType === 'incorrect') {
            list = all.filter(q => {
                let state = JSON.parse(localStorage.getItem(q.id)) || {};
                return state.incorrect === true;
            });
            document.getElementById('test-title').innerText = '❌ 오답 노트';
        }
        
        document.getElementById('btn-back-test').setAttribute('onclick', "navTo('screen-home')");
        currentList = list;
        renderTest(list);
    }

    function startTest(type) {
        let list = [];
        const all = [...questionsData];
        
        switch(type) {
            case 'random-10': list = all.sort(() => 0.5 - Math.random()).slice(0, 10); break;
            case 'random-20': list = all.sort(() => 0.5 - Math.random()).slice(0, 20); break;
            case 'chapter': list = all.filter(q => q.chapter === document.getElementById('sel-chapter').value); break;
            case 'type': list = all.filter(q => q.type === document.getElementById('sel-type').value); break;
            case 'freq': 
                const freq = parseInt(document.getElementById('sel-freq').value);
                if(freq === 4) list = all.filter(q => (q.years && q.years.length >= 4));
                else list = all.filter(q => (q.years && q.years.length === freq));
                break;
            case 'year-after-2015': list = all.filter(q => matchYear(q, 'after-2015')); break;
            case 'year-2011-2015': list = all.filter(q => matchYear(q, '2011-2015')); break;
            case 'year-before-2011': list = all.filter(q => matchYear(q, 'before-2011')); break;
            case 'recent-3': list = all.filter(q => matchYear(q, 'recent-3')); break;
            case 'year':
                const selYr = document.getElementById('sel-year').value;
                list = all.filter(q => {
                    if (!q.years) return false;
                    return q.years.some(y => y.split('-')[0] === selYr);
                });
                break;
            case 'all': list = all; break;
        }
        currentList = list;
        renderTest(list);
    }

    function renderTest(list) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        if(list.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;">조건에 해당하는 문제가 없습니다.</div>';
        }
        
        if(currentMode === 'study') document.getElementById('test-title').innerText = '📖 공부 모드';
        if(currentMode === 'exam') document.getElementById('test-title').innerText = '📝 시험 모드';
        
        list.forEach((q, index) => {
            const savedState = JSON.parse(localStorage.getItem(q.id)) || { diff: '', score: '' };
            const div = document.createElement('div');
            div.className = 'card';
            
            let html = `
                <div class="meta-info">
                    <span class="badge">단원 ${q.chapter.toUpperCase()}</span>
                    <span class="badge">유형: ${typeMap[q.type] || q.type}</span>
                    <span class="badge">회차: ${q.years.join(', ')}</span>
                </div>
                <div class="q-text">${index + 1}. ${q.question.replace(/\n/g, '<br>')}</div>
            `;
            
            if (currentMode === 'memory-note' || currentMode === 'incorrect-note') {
                html += `<button class="btn-delete" onclick="removeFromNote('${q.id}', '${currentMode}')" title="노트에서 삭제">✖</button>`;
            }
            
            if (q.q_image) {
                html += `<img src="./q_images/${q.q_image}" class="img-preview" style="display:block;" alt="문제 이미지">`;
            }

            if (currentMode === 'study' || currentMode === 'memory-note' || currentMode === 'incorrect-note') {
                let ansImgHtml = '';
                if (q.a_image) {
                    ansImgHtml = `<br><img src="./a_images/${q.a_image}" class="img-preview" style="display:block; margin-top:10px;" alt="정답 이미지">`;
                }
                
                html += `
                    <button class="btn-toggle" onclick="document.getElementById('ans_${q.id}').classList.toggle('show')">정답 보기 / 숨기기</button>
                    <div id="ans_${q.id}" class="answer-box"><strong style="color:var(--primary);">정답:</strong><br>${q.answer.replace(/\n/g, '<br>')}${ansImgHtml}</div>${renderDifficultyGroup(q.id, savedState.diff)}
                `;
            } else if (currentMode === 'exam') {
                html += `<textarea id="userans_${q.id}" placeholder="여기에 정답을 작성하세요..."></textarea>${renderDifficultyGroup(q.id, savedState.diff)}`;
            }
            div.innerHTML = html;
            container.appendChild(div);
        });
        
        document.getElementById('exam-action').style.display = (currentMode === 'exam' && list.length > 0) ? 'block' : 'none';
        navTo('screen-test');
    }
    
    function removeFromNote(id, mode) {
        if(confirm("정말 이 문제를 노트에서 삭제하겠습니까?")) {
            let state = JSON.parse(localStorage.getItem(id)) || {};
            if (mode === 'memory-note') {
                state.diff = '';
            } else if (mode === 'incorrect-note') {
                state.incorrect = false;
            }
            localStorage.setItem(id, JSON.stringify(state));
            
            openNote(mode.replace('-note', ''));
        }
    }
    
    function renderDifficultyGroup(id, currentDiff) {
        return `
            <div class="eval-row">
                <div class="btn-group">
                    <span style="font-size:13px; font-weight:bold; margin-right:5px;">암기도:</span>
                    <button class="diff-high ${currentDiff === 'high' ? 'active' : ''}" onclick="setDiff('${id}', 'high', this)">상(숙지)</button>
                    <button class="diff-mid ${currentDiff === 'mid' ? 'active' : ''}" onclick="setDiff('${id}', 'mid', this)">중</button>
                    <button class="diff-low ${currentDiff === 'low' ? 'active' : ''}" onclick="setDiff('${id}', 'low', this)">하(미숙)</button>
                </div>
            </div>
        `;
    }

    function gradeExam() {
        currentList.forEach(q => {
            const userAns = document.getElementById(`userans_${q.id}`).value;
            let state = JSON.parse(localStorage.getItem(q.id)) || {};
            state.tempAns = userAns;
            localStorage.setItem(q.id, JSON.stringify(state));
        });
        
        const container = document.getElementById('r-container');
        container.innerHTML = '';
        currentList.forEach((q, index) => {
            const savedState = JSON.parse(localStorage.getItem(q.id)) || {};
            const div = document.createElement('div');
            div.className = 'card';
            
            let html = `
                <div class="meta-info">
                    <span class="badge">단원 ${q.chapter.toUpperCase()}</span>
                    <span class="badge">유형: ${typeMap[q.type] || q.type}</span>
                    <span class="badge">회차: ${q.years.join(', ')}</span>
                </div>
                <div class="q-text">${index + 1}. ${q.question.replace(/\n/g, '<br>')}</div>
            `;
            if (q.q_image) {
                html += `<img src="./q_images/${q.q_image}" class="img-preview" style="display:block;" alt="문제 이미지">`;
            }
            
            let ansImgHtml = '';
            if (q.a_image) {
                ansImgHtml = `<br><img src="./a_images/${q.a_image}" class="img-preview" style="display:block; margin-top:10px;" alt="정답 이미지">`;
            }

            html += `
                <div style="background:#fff; border:1px solid #cbd5e1; padding:10px; border-radius:4px; margin-bottom:10px;">
                    <strong style="font-size:13px; color:#64748b;">내 답안:</strong><br><span style="white-space:pre-wrap;">${savedState.tempAns || '<span style="color:#94a3b8;">(미작성)</span>'}</span>
                </div>
                <div class="answer-box show" style="background:#f0fdf4; border:1px solid #bbf7d0;">
                    <strong style="color:#166534;">실제 정답:</strong><br><span style="white-space:pre-wrap;">${q.answer.replace(/\n/g, '<br>')}${ansImgHtml}</span>
                </div>
                
                <div class="eval-row" style="margin-top:20px; border-top:1px dashed var(--border); padding-top:15px;">
                    <div class="btn-group" id="score-grp-${q.id}">
                        <span style="font-size:13px; font-weight:bold; margin-right:5px;">자가 채점:</span>
                        <button class="score-full ${savedState.score === 'full' ? 'active' : ''}" onclick="setScore('${q.id}', 'full', this)">만점</button>
                        <button class="score-part ${savedState.score === 'part' ? 'active' : ''}" onclick="setScore('${q.id}', 'part', this)">애매(부분)</button>
                        <button class="score-zero ${savedState.score === 'zero' ? 'active' : ''}" onclick="setScore('${q.id}', 'zero', this)">오답</button>
                    </div>
                    <div>
                        <button id="btn-inc-${q.id}" class="btn-toggle ${savedState.incorrect ? 'active-red' : ''}" onclick="toggleIncorrect('${q.id}', this)">
                            ${savedState.incorrect ? '❌ 오답노트에서 빼기' : '📝 오답노트로 넘기기'}
                        </button>
                    </div>
                </div>
            `;
            div.innerHTML = html;
            container.appendChild(div);
        });
        navTo('screen-result');
    }

    function setDiff(id, level, btn) {
        let state = JSON.parse(localStorage.getItem(id)) || {};
        state.diff = (state.diff === level) ? '' : level;
        localStorage.setItem(id, JSON.stringify(state));
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        if(state.diff) btn.classList.add('active');
    }

    function setScore(id, type, btn) {
        let state = JSON.parse(localStorage.getItem(id)) || {};
        state.score = (state.score === type) ? '' : type;
        localStorage.setItem(id, JSON.stringify(state));
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        if(state.score) btn.classList.add('active');
    }
    
    function toggleIncorrect(id, btn) {
        let state = JSON.parse(localStorage.getItem(id)) || {};
        state.incorrect = !state.incorrect;
        localStorage.setItem(id, JSON.stringify(state));
        
        if (state.incorrect) {
            btn.innerHTML = '❌ 오답노트에서 빼기';
            btn.classList.add('active-red');
        } else {
            btn.innerHTML = '📝 오답노트로 넘기기';
            btn.classList.remove('active-red');
        }
    }
</script>
</body>
</html>
